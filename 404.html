<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | sflabs</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect width='32' height='32' rx='6' fill='%230F172A'/><path d='M8 10h16M8 16h10M8 22h16' stroke='%232D74DE' stroke-width='2.5' stroke-linecap='round'/><circle cx='23' cy='16' r='2.5' fill='%2310B981'/></svg>">
  
  <!-- Satoshi Fontshare CDN -->
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900,301,401,501,701,901&display=swap" rel="stylesheet">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            display: ['Satoshi', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            primary: {
              DEFAULT: "#2D74DE",
              deep: "#1E58B0",
              light: "#EFF6FF",
            },
            navy: {
              DEFAULT: "#0F172A",
              card: "#1E293B",
            },
            "slate-support": "#E2E8F0",
            "signal-green": "#10B981",
            slate: {
              editorial: "#475569",
              steel: "#64748B",
              muted: "#CBD5E1",
            }
          }
        }
      }
    }
  </script>
  <style>
    .sunset-stripe-band {
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, #1E58B0 0%, #2D74DE 35%, #60A5FA 70%, #E2E8F0 100%);
    }
  </style>
</head>
<body class="bg-white text-navy font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-blue-100 selection:text-primary">
  
  <!-- Header -->
  <header class="border-b border-slate-support bg-white/95 backdrop-blur px-6 py-4">
    <div class="mx-auto max-w-[1280px] flex items-center justify-between">
      <a href="/" aria-label="sflabs home" class="inline-flex items-center">
        <span class="font-display text-[24px] font-semibold italic tracking-tight text-primary lowercase">
          sflabs
        </span>
      </a>
      <a href="/" class="text-[13px] font-sans font-medium text-slate-editorial hover:text-primary transition-colors">
        Return to Home →
      </a>
    </div>
  </header>

  <!-- 404 Hero -->
  <main class="flex-1 flex items-center justify-center px-6 py-24 text-center">
    <div class="max-w-[560px] mx-auto">
      
      <!-- Label -->
      <div class="font-mono text-[11px] uppercase tracking-wider text-primary font-semibold mb-3">
        404 Error
      </div>

      <!-- Headline -->
      <h1 class="font-display text-[42px] sm:text-[54px] font-normal text-navy leading-[1.08] tracking-tight">
        Page Not Found.
      </h1>

      <!-- Description -->
      <p class="mt-4 font-sans text-[16px] leading-relaxed text-slate-editorial">
        The requested URI does not exist within the sflabs system graph.
      </p>

      <!-- Action Button -->
      <div class="mt-8 flex items-center justify-center">
        <a href="/" class="inline-flex items-center justify-center gap-2 rounded-md bg-primary hover:bg-primary-deep px-6 py-3.5 font-sans text-[13px] font-medium text-white transition-colors shadow-xs">
          <span>Return to Homepage</span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Signature Stripe Band -->
  <div class="sunset-stripe-band" role="presentation" aria-hidden="true"></div>

  <!-- Footer -->
  <footer class="bg-slate-50 border-t border-slate-support py-6 px-6 text-center font-mono text-[12px] text-slate-steel">
    © 2026 sflabs. All rights reserved.
  </footer>

</body>
</html>
