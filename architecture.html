<script>
(function() {
  var svg = document.querySelector('.blueprint-svg');
  var btnIn = document.getElementById('btnZoomIn');
  var btnOut = document.getElementById('btnZoomOut');
  var btnReset = document.getElementById('btnReset');
  var scale = 1;
  function apply() {
    if (!svg) return;
    svg.style.transform = scale === 1 ? '' : 'scale(' + scale + ')';
    svg.style.transformOrigin = 'center center';
    svg.style.transition = 'transform 0.18s ease';
  }
  if (btnIn) btnIn.addEventListener('click', function() { scale = Math.min(2.2, +(scale + 0.2).toFixed(2)); apply(); });
  if (btnOut) btnOut.addEventListener('click', function() { scale = Math.max(0.6, +(scale - 0.2).toFixed(2)); apply(); });
  if (btnReset) btnReset.addEventListener('click', function() { scale = 1; apply(); });
})();
</script>
