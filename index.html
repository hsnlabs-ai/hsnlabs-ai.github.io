<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSN Labs — Forward Deployed Engineering</title>
  <meta name="description" content="HSN Labs — Forward Deployed Engineering, AI Bootcamp, Proto-Ontologies, and Mission-Critical AI Systems.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect width='32' height='32' rx='8' fill='%23000'/><circle cx='16' cy='16' r='8' fill='%23FFFFFF'/></svg>">

  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Sound Control Button */
    .sound-toggle {
      position: fixed;
      top: 28px;
      left: 28px;
      background: transparent;
      border: none;
      color: #71717A;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      transition: color 0.2s, transform 0.2s;
      z-index: 100;
    }
    .sound-toggle:hover {
      color: #FFFFFF;
      transform: scale(1.1);
    }
    .sound-toggle svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Viewport Stage */
    .viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      position: relative;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .carousel-stage {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Floating Tooltip Capsule */
    .floating-tooltip {
      position: absolute;
      top: -46px;
      background: #18181B;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 9999px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 120;
      white-space: nowrap;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85);
    }
    .char-node:hover .floating-tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    /* Asynchronous Floating Physics */
    @keyframes floatAtom {
      0% { transform: translateY(-6px) rotate(-2deg); }
      50% { transform: translateY(-16px) rotate(-0.5deg); }
      100% { transform: translateY(-6px) rotate(-2deg); }
    }

    @keyframes floatChain {
      0% { transform: translateY(2px) rotate(1deg); }
      50% { transform: translateY(12px) rotate(2.5deg); }
      100% { transform: translateY(2px) rotate(1deg); }
    }

    @keyframes floatHourglass {
      0% { transform: translateY(12px) rotate(-1.5deg); }
      50% { transform: translateY(-2px) rotate(0.5deg); }
      100% { transform: translateY(12px) rotate(-1.5deg); }
    }

    @keyframes floatPeople {
      0% { transform: translateY(4px) rotate(1.5deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
      100% { transform: translateY(4px) rotate(1.5deg); }
    }

    /* Graph Container & Connecting Layer */
    .graph-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 540px;
    }

    /* SVG Connecting Lines Canvas */
    .graph-svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: visible;
    }

    .graph-edge {
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 2.5;
      stroke-dasharray: 6 6;
      fill: none;
      transition: stroke 0.3s, opacity 0.5s;
    }

    .graph-edge.edge-pulse {
      animation: dashFlow 2s linear infinite;
      stroke: rgba(167, 139, 250, 0.5);
    }

    @keyframes dashFlow {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }

    .characters-track {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 20;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .char-node {
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Badge SVG Sizing */
    .badge-svg {
      width: 210px;
      height: 210px;
      display: block;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .char-node:hover .badge-svg {
      transform: scale(1.08) translateY(-4px);
      filter: drop-shadow(0 26px 50px rgba(0, 0, 0, 0.95));
    }

    #char-0 .badge-svg { animation: floatAtom 6s ease-in-out infinite; }
    #char-1 .badge-svg { animation: floatPeople 6.5s ease-in-out infinite; }
    #char-2 .badge-svg { animation: floatHourglass 7s ease-in-out infinite; }
    #char-3 .badge-svg { animation: floatChain 6.2s ease-in-out infinite; }

    /* COLLAPSED STATE (INITIAL): Only HSN Labs visible in center */
    .state-collapsed .char-node.child-node {
      opacity: 0;
      pointer-events: none;
      width: 0;
      margin: 0;
      transform: scale(0.1) translateX(-60px);
      overflow: hidden;
    }

    .state-collapsed .graph-svg-layer {
      opacity: 0;
    }

    .state-collapsed #char-0 {
      transform: scale(1.15);
    }

    /* Pulsing discovery cue around HSN Labs when collapsed */
    .expand-cue {
      position: absolute;
      bottom: -60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .expand-cue-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #A1A1AA;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    .expand-cue-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #A78BFA;
      box-shadow: 0 0 10px #A78BFA;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    .state-expanded .expand-cue {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    /* EXPANDED STATE (CHAIN GRAPH): All 4 nodes displayed in linked sequence */
    .state-expanded .characters-track {
      gap: 36px;
    }

    .state-expanded .char-node.child-node {
      opacity: 1;
      pointer-events: auto;
      width: 210px;
      margin: 0;
      transform: scale(1) translateX(0);
    }

    .state-expanded .graph-svg-layer {
      opacity: 1;
    }

    .state-expanded #char-0 {
      transform: scale(1);
    }

    /* Mode Detail (Drawer open on right) */
    .viewport.mode-detail .carousel-stage {
      width: calc(100vw - 480px);
      flex: none;
    }

    .viewport.mode-detail .characters-track {
      transform: scale(0.85);
      gap: 20px;
    }

    .viewport.mode-detail .char-node {
      opacity: 0.35;
      filter: grayscale(0.5);
    }

    .viewport.mode-detail .char-node.is-active {
      opacity: 1;
      filter: none;
      transform: scale(1.1);
    }

    /* Detail Drawer Styles */
    .spec-drawer {
      width: 480px;
      height: 100vh;
      background: #09090B;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      position: absolute;
      right: 0;
      top: 0;
      transform: translateX(100%);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 40px;
      overflow-y: auto;
      z-index: 80;
    }

    .viewport.mode-detail .spec-drawer {
      transform: translateX(0);
    }

    .drawer-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: transparent;
      border: none;
      color: #71717A;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s;
    }
    .drawer-close:hover {
      color: #FFFFFF;
    }

    .spec-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #A78BFA;
      margin-bottom: 8px;
    }

    .spec-title {
      font-family: 'Satoshi', sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      margin-bottom: 12px;
    }

    .spec-desc {
      font-size: 14px;
      line-height: 1.6;
      color: #A1A1AA;
      margin-bottom: 28px;
    }

    .spec-table {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 32px;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }

    .spec-label {
      color: #71717A;
    }

    .spec-val {
      color: #FFFFFF;
      font-weight: 500;
    }

    .badge-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #E4E4E7;
      margin-left: 4px;
    }

    .drawer-deep-dive {
      margin-bottom: 32px;
    }

    .deep-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #71717A;
      margin-bottom: 16px;
    }

    .deep-block {
      margin-bottom: 16px;
    }
    .deep-block h4 {
      font-size: 13px;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .deep-block p {
      font-size: 12px;
      line-height: 1.6;
      color: #94A3B8;
    }

    .drawer-footer {
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: auto;
    }
    .drawer-microcopy {
      font-size: 11px;
      line-height: 1.5;
      color: #52525B;
      margin-bottom: 16px;
    }

    .drawer-action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 9999px;
      background: #FFFFFF;
      color: #000000;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .drawer-action-btn:hover {
      background: #E4E4E7;
      transform: translateY(-1px);
    }

    /* Bottom Brand Bar */
    .bottom-brand {
      position: absolute;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }

    .brand-logo-wrap {
      text-decoration: none;
      cursor: pointer;
    }

    .logo-text {
      font-family: 'Satoshi', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #FFFFFF;
      opacity: 0.9;
      transition: opacity 0.2s;
    }
    .logo-text:hover { opacity: 1; }

    .sub-links {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #71717A;
    }
    .sub-links a {
      color: #71717A;
      text-decoration: none;
      transition: color 0.15s;
    }
    .sub-links a:hover, .sub-links a.active {
      color: #FFFFFF;
    }
    .sub-links .dot {
      color: #3F3F46;
      font-size: 8px;
    }

    /* Reset Graph Action */
    .reset-graph-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #A1A1AA;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 10px;
      border-radius: 9999px;
      cursor: pointer;
      display: none;
      transition: all 0.2s;
    }
    .reset-graph-btn:hover {
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .state-expanded .reset-graph-btn {
      display: inline-block;
    }

    @media (max-width: 1024px) {
      .spec-drawer { width: 100vw; }
      .viewport.mode-detail .carousel-stage { width: 0; overflow: hidden; }
      .state-expanded .characters-track { flex-wrap: wrap; height: auto; gap: 16px; }
      .graph-svg-layer { display: none; }
    }
  </style>
</head>

<body>

  <button id="soundToggle" class="sound-toggle" aria-label="Toggle Sound">
    <svg id="soundIcon" viewBox="0 0 24 24">
      <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5 0L6.5 7H2v10h4.5l5 3.77V3.23z"/>
    </svg>
  </button>

  <div id="viewport" class="viewport mode-overview state-collapsed">

    <div class="carousel-stage">
      
      <div class="graph-container" id="graphContainer">
        
        <!-- SVG Link Graph Canvas: connects HSN Labs -> About Us -> AI Bootcamp -> Proto-Ontologies -->
        <svg class="graph-svg-layer" id="graphSvg" viewBox="0 0 1200 540">
          <defs>
            <linearGradient id="edgeGrad01" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
            </linearGradient>
            <linearGradient id="edgeGrad12" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
            </linearGradient>
            <linearGradient id="edgeGrad23" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#FB923C" stop-opacity="0.8"/>
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>

          <!-- Edge 0 -> 1: HSN Labs to About Us -->
          <line id="edge-0-1" class="graph-edge edge-pulse" stroke="url(#edgeGrad01)" filter="url(#glow)"/>
          <!-- Edge 1 -> 2: About Us to AI Bootcamp -->
          <line id="edge-1-2" class="graph-edge edge-pulse" stroke="url(#edgeGrad12)" filter="url(#glow)"/>
          <!-- Edge 2 -> 3: AI Bootcamp to Proto-Ontologies -->
          <line id="edge-2-3" class="graph-edge edge-pulse" stroke="url(#edgeGrad23)" filter="url(#glow)"/>
        </svg>

        <div class="characters-track" id="charactersTrack">

          <!-- 0. HSN LABS (Root Node: Atomic Orbital Sticker - Purple / Lavender) -->
          <div class="char-node root-node" id="char-0" onclick="handleNodeClick(0)">
            <div class="floating-tooltip">HSN Labs</div>
            <svg class="badge-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="25" y="25" width="190" height="190" rx="55" fill="#FFFFFF" stroke="#A78BFA" stroke-width="12" stroke-linejoin="round"/>
              <rect x="37" y="37" width="166" height="166" rx="45" fill="#13111C"/>
              <circle cx="120" cy="120" r="16" fill="#FFFFFF"/>
              <ellipse cx="120" cy="120" rx="66" ry="24" stroke="#FFFFFF" stroke-width="8" fill="none"/>
              <ellipse cx="120" cy="120" rx="66" ry="24" stroke="#FFFFFF" stroke-width="8" fill="none" transform="rotate(60 120 120)"/>
              <ellipse cx="120" cy="120" rx="66" ry="24" stroke="#FFFFFF" stroke-width="8" fill="none" transform="rotate(-60 120 120)"/>
              <circle cx="178" cy="120" r="6" fill="#A78BFA"/>
              <circle cx="91" cy="68" r="6" fill="#A78BFA"/>
              <circle cx="91" cy="172" r="6" fill="#A78BFA"/>
            </svg>
            <div class="expand-cue">
              <div class="expand-cue-pill">
                <span class="expand-cue-dot"></span>
                <span>Click to expand graph</span>
              </div>
            </div>
          </div>

          <!-- 1. ABOUT US (Child Node 1: Connected Squad - Emerald Green) -->
          <div class="char-node child-node" id="char-1" onclick="handleNodeClick(1)">
            <div class="floating-tooltip">About Us</div>
            <svg class="badge-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="25" y="25" width="190" height="190" rx="55" fill="#FFFFFF" stroke="#10B981" stroke-width="12" stroke-linejoin="round"/>
              <rect x="37" y="37" width="166" height="166" rx="45" fill="#0D1914"/>
              <circle cx="82" cy="108" r="14" fill="#FFFFFF"/>
              <path d="M60 160C60 142 70 134 82 134C94 134 104 142 104 160" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none"/>
              <circle cx="158" cy="108" r="14" fill="#FFFFFF"/>
              <path d="M136 160C136 142 146 134 158 134C170 134 180 142 180 160" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none"/>
              <circle cx="120" cy="88" r="17" fill="#FFFFFF"/>
              <path d="M92 146C92 124 104 116 120 116C136 116 148 124 148 146" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" fill="none"/>
              <path d="M96 108H144" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="4 4"/>
            </svg>
          </div>

          <!-- 2. AI BOOTCAMP (Child Node 2: Precision Hourglass - Sky Blue) -->
          <div class="char-node child-node" id="char-2" onclick="handleNodeClick(2)">
            <div class="floating-tooltip">AI Bootcamp</div>
            <svg class="badge-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="25" y="25" width="190" height="190" rx="55" fill="#FFFFFF" stroke="#38BDF8" stroke-width="12" stroke-linejoin="round"/>
              <rect x="37" y="37" width="166" height="166" rx="45" fill="#0E1620"/>
              <rect x="74" y="66" width="92" height="12" rx="6" fill="#FFFFFF"/>
              <rect x="74" y="162" width="92" height="12" rx="6" fill="#FFFFFF"/>
              <path d="M84 78C84 106 112 116 116 120C112 124 84 134 84 162H156C156 134 128 124 124 120C128 116 156 106 156 78H84Z" 
                    stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" fill="none"/>
              <path d="M96 88H144C144 100 134 108 120 114C106 108 96 100 96 88Z" fill="#FFFFFF"/>
              <line x1="120" y1="114" x2="120" y2="136" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
              <path d="M96 152H144C144 144 136 138 120 138C104 138 96 144 96 152Z" fill="#FFFFFF"/>
            </svg>
          </div>

          <!-- 3. PROTO-ONTOLOGIES (Child Node 3: Interlocked Chain - Orange / Amber) -->
          <div class="char-node child-node" id="char-3" onclick="handleNodeClick(3)">
            <div class="floating-tooltip">Proto-Ontologies</div>
            <svg class="badge-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="25" y="25" width="190" height="190" rx="55" fill="#FFFFFF" stroke="#FB923C" stroke-width="12" stroke-linejoin="round"/>
              <rect x="37" y="37" width="166" height="166" rx="45" fill="#19120E"/>
              <g transform="rotate(-45 120 120)" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <path d="M120 78H98C87 78 78 87 78 98V118C78 129 87 138 98 138H120"/>
                <path d="M120 102H142C153 102 162 111 162 122V142C162 153 153 162 142 162H120"/>
                <line x1="98" y1="138" x2="142" y2="102" stroke="#FFFFFF" stroke-width="14"/>
              </g>
            </svg>
          </div>

        </div>

      </div>

      <!-- Bottom Brand Bar -->
      <div class="bottom-brand">
        <a href="javascript:void(0)" onclick="resetGraph()" class="brand-logo-wrap">
          <span class="logo-text">HSN LABS</span>
        </a>
        <div class="sub-links" id="subLinks">
          <a href="javascript:void(0)" onclick="handleNodeClick(0)">HSN Labs</a>
          <span class="dot">•</span>
          <a href="javascript:void(0)" onclick="handleNodeClick(1)">About Us</a>
          <span class="dot">•</span>
          <a href="javascript:void(0)" onclick="handleNodeClick(2)">AI Bootcamp</a>
          <span class="dot">•</span>
          <a href="javascript:void(0)" onclick="handleNodeClick(3)">Proto-Ontologies</a>
          <button class="reset-graph-btn" onclick="resetGraph()">Reset Graph</button>
        </div>
      </div>

    </div>

    <!-- Scrollable Detail Drawer -->
    <aside class="spec-drawer" id="specDrawer">
      <button class="drawer-close" onclick="closeDrawer()" aria-label="Close">&times;</button>
      
      <div id="drawerBody"></div>
      <div id="drawerDeepDive" class="drawer-deep-dive"></div>
      <div class="drawer-footer" id="drawerFooter"></div>
    </aside>

  </div>

  <script>
    let soundActive = true;

    const catalog = [

    function triggerAudio(frequency = 440, type = 'sine', duration = 0.08) {
      if (!soundActive) return;
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioContext.currentTime);
        osc.frequency.exponentialRampToValueAtTime(frequency * 1.35, audioContext.currentTime + duration);

        gain.gain.setValueAtTime(0.12, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + duration);
      } catch (e) {}
    }

    document.getElementById('soundToggle').addEventListener('click', () => {
      soundActive = !soundActive;
      document.getElementById('soundToggle').style.opacity = soundActive ? '1' : '0.25';
      if (soundActive) triggerAudio(520, 'sine', 0.1);
    });

    function updateGraphEdges() {
      if (!isGraphExpanded) return;
      const svg = document.getElementById('graphSvg');
      const containerRect = document.getElementById('graphContainer').getBoundingClientRect();
      
      const getNodeCenter = (id) => {
        const el = document.getElementById(`char-${id}`);
        if (!el) return { x: 0, y: 0 };
        const r = el.getBoundingClientRect();
        return {
          x: (r.left + r.width / 2) - containerRect.left,
          y: (r.top + r.height / 2) - containerRect.top
        };
      };

      const c0 = getNodeCenter(0);
      const c1 = getNodeCenter(1);
      const c2 = getNodeCenter(2);
      const c3 = getNodeCenter(3);

      const setLine = (edgeId, p1, p2) => {
        const line = document.getElementById(edgeId);
        if (line) {
          line.setAttribute('x1', p1.x);
          line.setAttribute('y1', p1.y);
          line.setAttribute('x2', p2.x);
          line.setAttribute('y2', p2.y);
        }
      };

      setLine('edge-0-1', c0, c1);
      setLine('edge-1-2', c1, c2);
      setLine('edge-2-3', c2, c3);
    }

    window.addEventListener('resize', () => {
      requestAnimationFrame(updateGraphEdges);
    });

    function handleNodeClick(index) {
      // First click on HSN Labs expands the link graph
      if (index === 0 && !isGraphExpanded) {
        expandGraph();
        return;
      }

      // If graph is already expanded (or clicking a child node), open drawer
      if (!isGraphExpanded) {
        expandGraph();
      }
      openDrawer(index);
    }

    function expandGraph() {
      isGraphExpanded = true;
      const viewport = document.getElementById('viewport');
      viewport.classList.remove('state-collapsed');
      viewport.classList.add('state-expanded');

      triggerAudio(440, 'sine', 0.12);
      setTimeout(() => triggerAudio(660, 'triangle', 0.18), 120);

      // Re-calculate edge coordinates as nodes slide in
      const steps = [100, 250, 450, 650];
      steps.forEach(delay => setTimeout(updateGraphEdges, delay));
    }

    function resetGraph() {
      isGraphExpanded = false;
      closeDrawer();

      const viewport = document.getElementById('viewport');
      viewport.classList.remove('state-expanded');
      viewport.classList.add('state-collapsed');

      triggerAudio(340, 'sine', 0.1);
    }

    function openDrawer(index) {
      currentIdx = index;
      triggerAudio(580 + (index * 40), 'sine', 0.12);

      const viewport = document.getElementById('viewport');
      viewport.classList.remove('mode-overview');
      viewport.classList.add('mode-detail');

      for (let i = 0; i < 4; i++) {
        const node = document.getElementById(`char-${i}`);
        node.classList.remove('is-active');
        if (i === index) {
          node.classList.add('is-active');
        }
      }

      const item = catalog[index];
      const badges = item.surfaces.map(s => `<span class="badge-pill">${s}</span>`).join(' ');

      document.getElementById('drawerBody').innerHTML = `
        <div class="spec-tag">${item.tag}</div>
        <h2 class="spec-title">${item.name}</h2>
        <p class="spec-desc">${item.description}</p>
        
        <div class="spec-table">
          <div class="spec-row">
            <span class="spec-label">Surfaces</span>
            <span class="spec-val">${badges}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Industry</span>
            <span class="spec-val">${item.industry}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Since</span>
            <span class="spec-val">${item.since}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Ecosystem</span>
            <span class="spec-val text-xs text-zinc-300 font-mono">${item.ecosystem}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Status</span>
            <span class="spec-val text-emerald-400 font-mono text-xs">${item.status}</span>
          </div>
        </div>
      `;

      const blocksHtml = item.deepDiveBlocks.map(b => `
        <div class="deep-block">
          <h4>${b.title}</h4>
          <p>${b.text}</p>
        </div>
      `).join('');

      document.getElementById('drawerDeepDive').innerHTML = `
        <div class="deep-title">[ ${item.deepDiveTitle} ]</div>
        ${blocksHtml}
      `;

      document.getElementById('drawerFooter').innerHTML = `
        <div class="drawer-microcopy">${item.microcopy}</div>
        <button class="drawer-action-btn" id="drawerActionBtn">${item.actionLabel} &rarr;</button>
      `;

      document.getElementById('drawerActionBtn').onclick = item.actionFn;

      setTimeout(updateGraphEdges, 300);
    }

    function closeDrawer() {
      currentIdx = null;
      triggerAudio(320, 'sine', 0.08);

      const viewport = document.getElementById('viewport');
      viewport.classList.remove('mode-detail');
      viewport.classList.add('mode-overview');

      for (let i = 0; i < 4; i++) {
        const node = document.getElementById(`char-${i}`);
        node.classList.remove('is-active');
      }

      setTimeout(updateGraphEdges, 300);
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (currentIdx !== null) {
          closeDrawer();
        } else if (isGraphExpanded) {
          resetGraph();
        }
      }
    });
  </script>
